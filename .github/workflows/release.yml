name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/gherkin-${{ github.event.release.tag_name }}-${{ matrix.name }}${{ matrix.ext }}" .

      - name: Generate checksum
        shell: pwsh
        run: |
          $file = "dist/gherkin-${{ github.event.release.tag_name }}-${{ matrix.name }}${{ matrix.ext }}"
          (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $file -Leaf) | Out-File -FilePath "$file.sha256" -Encoding ascii -NoNewline

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-${{ matrix.name }}
          path: |
            dist/gherkin-${{ github.event.release.tag_name }}-${{ matrix.name }}${{ matrix.ext }}
            dist/gherkin-${{ github.event.release.tag_name }}-${{ matrix.name }}${{ matrix.ext }}.sha256

  release:
    name: Upload release binaries
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*

  update-readme:
    name: Update README version
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version in README
        env:
          NEW_VERSION: ${{ github.event.release.tag_name }}
        run: |
          OLD_VERSION=$(grep -oP '(?<=\$version = ")[^"]+' README.md)
          ESCAPED_OLD=$(printf '%s' "$OLD_VERSION" | sed 's/[.[\*^$/]/\\&/g')
          ESCAPED_NEW=$(printf '%s' "$NEW_VERSION" | sed 's/[&/\]/\\&/g')
          sed -i "s/$ESCAPED_OLD/$ESCAPED_NEW/g" README.md

      - name: Update checksum in README
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ github.event.release.tag_name }}
        run: |
          BINARY="gherkin-$NEW_VERSION-windows-amd64.exe"
          gh release download "$NEW_VERSION" -p "$BINARY.sha256" -O "$BINARY.sha256"
          NEW_SHA256=$(cut -d ' ' -f1 "$BINARY.sha256")
          OLD_SHA256=$(grep -oP '(?<=\$expected = ")[^"]+' README.md)
          sed -i "s/$OLD_SHA256/$NEW_SHA256/g" README.md
          rm "$BINARY.sha256"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="docs/readme-version-$NEW_VERSION"
          git checkout -b "$BRANCH"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update README to version $NEW_VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: update README to version $NEW_VERSION" \
            --body "Bumps the version referenced in README.md to $NEW_VERSION."
